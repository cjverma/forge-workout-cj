<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="/manifest.json?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>FORGE</title>
<!-- Preload only the two faces that paint on first frame (body 400 + display 600).
     crossorigin is REQUIRED even same-origin — fonts always fetch in CORS mode,
     and omitting it makes the browser fetch the file twice. -->
<link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts — pre-cached by sw.js, render fully offline. No CDN. */
@font-face{
  font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;
  src:url('/fonts/barlow-condensed-600.woff2') format('woff2');
}
@font-face{
  font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;
  src:url('/fonts/barlow-condensed-700.woff2') format('woff2');
}
@font-face{
  font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;
  src:url('/fonts/barlow-400.woff2') format('woff2');
}
@font-face{
  font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;
  src:url('/fonts/barlow-500.woff2') format('woff2');
}
@font-face{
  font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;
  src:url('/fonts/barlow-600.woff2') format('woff2');
}
@font-face{
  font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;
  src:url('/fonts/barlow-700.woff2') format('woff2');
}
:root{
  color-scheme: light dark; /* auto — light-dark() resolves against this */
  /* ── themed tokens · light = warm off-white paper · dark = deep near-black ──
     Every step must stay DISTINCT from its neighbours. Previously --s0 == --s1
     (both #FFFFFF) in light and --b1 == --s3 in dark, so one of the five
     surface steps collapsed in each theme: light mode was pure-white cards on
     grey (the generic-dashboard signature) and dark-mode card borders were
     invisible. The light ramp is warm-neutral on purpose — a hair of warmth is
     what reads as paper rather than as an unstyled default. test.js asserts no
     two steps collapse. */
  --black:light-dark(#EDECEA,#08080A);
  --s0:light-dark(#FFFFFF,#101014);
  --s1:light-dark(#FAF9F7,#15151A);
  --s2:light-dark(#F1F0EC,#1E1E24);
  --s3:light-dark(#E6E4DF,#26262E);
  --b1:light-dark(#E3E0DA,#2A2A33);
  --b2:light-dark(#CFCBC3,#3A3A45);
  --dim:light-dark(#6A6A73,#73737E);
  --mid:light-dark(#55555E,#9EA0A8);
  --lt:light-dark(#34343C,#C9CAD1);
  --white:light-dark(#131316,#F4F4F1);
  /* volt accent system: --accent = fills · --accent-ink = text ON fills ·
     --accent-text = accent-coloured text/strokes on surfaces (moss in light —
     raw volt on white is 1.5:1, illegible) · --accent-lo = tint bg */
  --accent:light-dark(#B9E425,#C8F135);
  --accent-ink:#121403;
  --accent-text:light-dark(#55700B,#C8F135);
  /* Gradient fill for primary CTAs — flat --accent was reading as flat/cheap
     next to reference apps that gradient-fill everything. Subtle diagonal
     shift toward a deeper volt tone, not a hue change, so it still reads
     as "the accent color" not a different color. */
  --accent-grad:linear-gradient(135deg,light-dark(#C3EA30,#D4F55A),light-dark(#9FC71A,#A8D62C));
  --accent-lo:light-dark(#EDF4D3,#222B0E);
  --orange:var(--accent-text);
  --orange-lo:var(--accent-lo);
  --orange-mid:light-dark(#5F6E36,#B7C784);
  --on-accent:var(--accent-ink);
  --green:light-dark(#147B3B,#3ECF77);
  --green-lo:light-dark(#E3F3E8,#0D2415);
  --red:light-dark(#BF3D33,#F26257);
  --red-lo:light-dark(#FBEAE8,#2A1210);
  --amber:light-dark(#985E0B,#E8A33C);
  --amber-lo:light-dark(#FAF2DE,#262009);
  --blue:light-dark(#2E6FD8,#6FA2F2);
  --shadow:0 1px 2px light-dark(rgba(16,16,20,.05),rgba(0,0,0,.45)),0 6px 20px light-dark(rgba(16,16,20,.07),rgba(0,0,0,.4));
  --shadow-lift:0 2px 6px light-dark(rgba(16,16,20,.08),rgba(0,0,0,.55)),0 14px 36px light-dark(rgba(16,16,20,.12),rgba(0,0,0,.5));
  /* ── card material ──
     The reason .hero reads as a physical lit object and ordinary cards read as
     flat rectangles is the light-source cue: heroes have a gradient plus a
     BRIGHTER top edge, cards had a uniform 1px box. --card-grad is a near-
     invisible vertical ramp and --card-edge is the lit top hairline. Together
     they're the difference between a filled shape and a lit one. Apply via the
     .surface class, never by re-declaring background on individual cards. */
  --card-grad:linear-gradient(180deg,light-dark(#FFFFFF,#1A1A21) 0%,light-dark(#FAF9F7,#15151A) 100%);
  --card-edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.06));
  /* Scrim behind modals/sheets/drawer. Was four different flat black rgba()
     values with no blur anywhere in the app; one token + backdrop blur so
     overlaid content dissolves instead of being covered by a grey slab.
     @supports fallback below raises alpha where backdrop-filter is missing. */
  --scrim:light-dark(rgba(237,236,234,.72),rgba(8,8,10,.72));
  --scrim-blur:blur(20px) saturate(140%);
  /* ── theme-independent tokens · heroes stay dark in BOTH themes ── */
  --font-display:'Barlow Condensed','Barlow',sans-serif;
  --font-body:'Barlow',system-ui,sans-serif;
  /* Canonical "eyebrow label" style — the small uppercase section/field
     labels used throughout Settings, cards, and section headers. Was
     previously ~20 near-duplicate one-off values (9-12px, weight
     600/700/800, letter-spacing 1-3px); consolidated to one scale so
     labels read as one consistent system instead of ad hoc per component. */
  --fs-label:11px;
  --fw-label:700;
  --ls-label:1.5px;
  /* Caption labels: the in-card variant of an eyebrow. There were ~26 eyebrow
     treatments and ~55-60 rendered instances, so every section shouted equally
     and nothing read as emphasis. Landmarks (.sec/.hero-kicker/.nut-kicker/
     .st-sec) keep the uppercase --*-label treatment above; captions inside a
     card demote to sentence case with these. */
  --fs-cap:12px;
  --fw-cap:500;
  /* ── SHAPE SCALE ──
     Was 27 distinct border-radius values, including two competing pill idioms
     (99px and 999px). Rounding at arbitrary values is what reads as
     unconsidered. 50% is kept separately for genuinely circular elements. */
  --r-sm:10px;   /* inputs, chips, small buttons */
  --r-md:14px;   /* set rows, sub-cards, list items */
  --r-lg:20px;   /* cards, accordions */
  --r-xl:26px;   /* heroes, bottom sheets */
  --r-pill:999px;
  /* ── SPACING SCALE ──
     Was essentially every integer from 5px to 20px used as a padding value,
     and four different page gutters (14/16/18/20px) so nothing aligned down
     the page edge. --sp-4 is THE page gutter. */
  --sp-1:4px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:24px;
  --sp-6:32px;
  --grad-push:linear-gradient(150deg,#3A2226 0%,#22161A 55%,#120D0F 100%);
  --grad-pull:linear-gradient(150deg,#20283C 0%,#161B2A 55%,#0D0F16 100%);
  --grad-legs:linear-gradient(150deg,#2E2A3E 0%,#1D1A2B 55%,#100E17 100%);
  --grad-core:linear-gradient(150deg,#1F3028 0%,#15201B 55%,#0C110E 100%);
  --grad-rest:linear-gradient(150deg,#26262C 0%,#1A1A1F 55%,#0F0F12 100%);
  --grad-nut:linear-gradient(150deg,#272B1C 0%,#191C12 55%,#0E100A 100%);
  --hero-fg:#FFFFFF;
  --hero-fg-dim:rgba(255,255,255,.62);
  --hero-fg-faint:rgba(255,255,255,.4);
  --hero-chip:rgba(255,255,255,.12);
  --hero-line:rgba(255,255,255,.22);
  --hero-accent:#C8F135;
  --hero-pos:#BDF7CB;
  --hero-neg:#FFC9C2;
  --chart-p:#C8F135;--chart-c:#5EA0F2;--chart-f:#3EC97E;--chart-fi:#B08CF9;
}
html[data-theme="light"]{color-scheme:light;}
html[data-theme="dark"]{color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
/* Universal tactile press feedback — native buttons squish slightly on tap
   instead of only changing color/opacity. Composes with any more-specific
   :active rule below since it's a different property (transform). */
button{transition:transform .12s ease;}
button:active:not(:disabled){transform:scale(.96);}
.nav-item,.st-row,.dd-item{transition:transform .12s ease;}
.nav-item:active,.st-row:active,.dd-item:active{transform:scale(.97);}
html,body{height:100%;overflow:hidden;background:var(--black);}
/* Barlow has a smaller x-height than Inter at the same px size, so body copy
   reads slightly small on a straight swap. 16.5px restores the optical size.
   Tune here only — never per-component. */
body{font-family:var(--font-body);font-size:16.5px;color:var(--white);max-width:430px;margin:0 auto;display:flex;flex-direction:column;height:100dvh;}

/* Barlow defaults to PROPORTIONAL figures, so any number that updates in place
   (weights, reps, timers, macro counters) jitters horizontally as digits change
   — "1" is far narrower than "8". Lock tabular figures on every changing number.
   Deliberately NOT on body/prose: tabular digits in running text read wide and
   gappy. New counters/inputs/cells must opt in here. */
input[type="number"],input[inputmode="decimal"],input[inputmode="numeric"],
.cf-num,.num-row,.set-row,.set-hdr,.ex-meta,.hero-count,.vol-count,
.tbar-val,.mpie-val,.pm-change-val,.sum-stat{
  font-variant-numeric: tabular-nums;
}

/* ── HEADER ── */
.hdr{padding:calc(var(--sp-4) + env(safe-area-inset-top,0px)) var(--sp-4) 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--black);}
.logo{font-family:var(--font-body);font-size:19px;font-weight:700;letter-spacing:4px;color:var(--white);text-transform:uppercase;}
.target-pill{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-pill);padding:6px 14px;font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--mid);text-transform:uppercase;box-shadow:var(--shadow);}

/* ── IMMERSIVE DARK CARD TEXT ISOLATION ── */
/* Hero/quote/nut-hero gradients stay dark in BOTH themes — text inside must
   never inherit themed tokens (light mode would render it invisible). This
   guard comes FIRST so specific hero rules below override by cascade. */
.hero,.hero *,.quote-card,.quote-card *,.nut-hero,.nut-hero *{color:var(--hero-fg);}

/* ── QUOTE ── */
.quote{padding:6px 16px 10px;flex-shrink:0;background:var(--black);}
.quote-card>.quote-overlay{position:absolute!important;inset:0;padding:13px 16px;background:var(--grad-rest);border-radius:16px;z-index:2;transition:opacity .8s ease;}
.quote-card>.quote-overlay::after{content:"";position:absolute;inset:0;border-radius:16px;background:radial-gradient(120% 90% at 85% -10%,rgba(200,241,53,.10),transparent 55%);pointer-events:none;}
.quote-card{background:var(--grad-rest);border:none;border-top:1px solid rgba(200,241,53,.18);border-radius:16px;padding:13px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-lift);}
.quote-card::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% -10%,rgba(200,241,53,.10),transparent 55%);pointer-events:none;}
.quote-card>*{position:relative;z-index:1;}
.quote-icon{display:none;}
.quote-body{display:block;font-size:13px;font-weight:600;color:var(--hero-fg);line-height:1.45;letter-spacing:0.1px;}
.quote-author{display:block;font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--hero-fg-dim);margin-top:5px;}

/* ── DAY NAV (date strip) ── */
.days{display:flex;gap:4px;padding:10px 16px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--black);}
.days::-webkit-scrollbar{display:none;}
.day-btn{flex:1 0 auto;min-width:46px;padding:8px 6px 9px;border-radius:14px;font-size:11px;font-weight:500;letter-spacing:0.2px;border:1px solid transparent;color:var(--dim);background:transparent;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.day-btn.today{color:var(--mid);}
.day-btn.today::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--orange);margin-top:1px;}
.day-btn.active{background:var(--white);border-color:var(--white);color:var(--black);font-weight:700;box-shadow:var(--shadow);}
.day-date{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;opacity:1;}
.wk-nav{display:flex;align-items:center;padding:8px 18px 6px;gap:8px;}
.wk-nav-btn{background:var(--s2);border:1px solid var(--b2);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--mid);cursor:pointer;font-family:var(--font-body);transition:opacity .15s;}
.wk-nav-btn:disabled{opacity:0.25;cursor:default;}
.wk-nav-lbl{flex:1;font-size:12px;color:var(--mid);text-align:center;line-height:1.5;}
.wk-nav-cur{font-size:10px;color:var(--green);display:block;}
.wk-nav-back{font-size:10px;color:var(--orange);display:block;cursor:pointer;text-decoration:underline;}
.past-banner{margin:0 18px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--b2);border-radius:8px;padding:7px 12px;font-size:11px;color:var(--dim);text-align:center;}

/* ── SCROLL ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:104px;overscroll-behavior-y:contain;}
.ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-48px);width:36px;height:36px;border-radius:50%;background:var(--s1);box-shadow:var(--shadow-lift);display:flex;align-items:center;justify-content:center;z-index:60;transition:transform .2s ease;pointer-events:none;}
.ptr svg{width:18px;height:18px;stroke:var(--white);fill:none;stroke-width:2.2;stroke-linecap:round;}
.ptr.spin svg{animation:ptrSpin .8s linear infinite;}
@keyframes ptrSpin{to{transform:rotate(360deg)}}

/* ── PAGE HEADER ── */
.pg{padding:var(--sp-4) var(--sp-4) 0;}
.pg-title{font-family:var(--font-display);font-size:36px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--white);line-height:1.02;}
.pg-title span{color:var(--orange);}
.pg-sub{font-size:13px;color:var(--dim);margin-top:5px;letter-spacing:0.1px;}

/* ── HERO (gradient day card) ── */
.hero{margin:6px var(--sp-4) var(--sp-1);border-radius:var(--r-xl);padding:22px 20px 18px;border-top:1px solid rgba(200,241,53,.28);position:relative;overflow:hidden;box-shadow:var(--shadow-lift);}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% -10%,rgba(200,241,53,.14),transparent 55%),radial-gradient(100% 70% at 15% 110%,rgba(255,255,255,.06),transparent 60%);pointer-events:none;}
.hero-push{background:var(--grad-push);}
.hero-pull{background:var(--grad-pull);}
.hero-legs{background:var(--grad-legs);}
.hero-rest{background:var(--grad-rest);}
.hero-core{background:var(--grad-core);}
.hero-kicker{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--hero-fg-dim);margin-bottom:6px;}
.hero-title{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:1.0;}
.hero-sub{font-size:13px;color:var(--hero-fg-dim);margin-top:6px;font-weight:500;}
.hero-prog{margin-top:16px;height:5px;background:var(--hero-line);border-radius:var(--r-pill);overflow:hidden;}
.hero-prog-fill{height:100%;background:var(--hero-accent);border-radius:var(--r-pill);transition:width .5s ease;}
.hero-count{font-size:11px;font-weight:600;color:var(--hero-fg-dim);margin-top:7px;}
.hero-streak{font-size:11px;font-weight:600;margin-top:4px;color:var(--hero-accent);}
.pr-badge{font-size:10px;font-weight:600;color:var(--accent-text);margin-top:3px;}
.ss-chip{display:inline-flex;align-items:center;gap:2px;color:var(--accent-text);font-weight:600;}
.swap-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;background:var(--scrim);backdrop-filter:var(--scrim-blur);-webkit-backdrop-filter:var(--scrim-blur);}
.swap-modal.show{display:flex;}
.swap-sheet{width:100%;max-height:78vh;overflow-y:auto;background:var(--black);border-top:1px solid var(--b1);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp-4);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--sp-4));box-shadow:var(--shadow-lift);}
.swap-head{margin-bottom:var(--sp-3);}
.swap-title{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:20px;color:var(--white);letter-spacing:.01em;}
.swap-sub{font-size:var(--fs-cap);font-weight:var(--fw-cap);color:var(--mid);margin-top:2px;}
.swap-list{display:flex;flex-direction:column;gap:var(--sp-2);}
.swap-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;color:var(--white);font-family:var(--font-body);}
.swap-item:active{border-color:var(--accent-text);}
.swap-name{font-size:14px;font-weight:600;}
.swap-meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
.swap-keep{width:100%;margin-top:var(--sp-3);background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r-pill);padding:14px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;}
.ss-chip .icon{stroke-width:2;}

/* ── PROGRESS ── */
.prog-wrap{margin:14px var(--sp-4) 0;height:3px;background:var(--b1);border-radius:var(--r-pill);overflow:hidden;}
.prog-fill{height:100%;background:var(--orange);border-radius:var(--r-pill);transition:width .5s ease;}

/* ── SESSION BAR ── */
.session-bar{margin:14px 16px;display:flex;gap:10px;}
.btn-start{flex:1;padding:16px;background:var(--accent-grad);border:none;border-radius:var(--r-pill);font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent-ink);cursor:pointer;text-transform:uppercase;transition:opacity .15s,transform .12s ease;box-shadow:var(--shadow);}
.btn-start:active{opacity:.8;}
.btn-stop{flex:1;padding:16px;background:transparent;border:1.5px solid var(--red);border-radius:var(--r-pill);font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--red);cursor:pointer;text-transform:uppercase;display:none;}
.btn-stop.show{display:block;}
.btn-start.hide{display:none;}
.sess-complete{flex:1;padding:16px;background:var(--green-lo);border:none;border-radius:var(--r-pill);font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--green);text-align:center;text-transform:uppercase;}

/* ── SECTION LABEL ── */
.sec{padding:var(--sp-5) var(--sp-4) 10px;font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--mid);text-transform:uppercase;display:flex;align-items:center;gap:8px;}

/* ── EXERCISE CARD ── */
.ex-card{
  margin:0 16px 10px;
  background:var(--s1);
  border:1px solid var(--b1);
  border-radius:var(--r-lg);
  overflow:hidden;
  
  transition:border-color .25s, box-shadow .25s;
}
.ex-card.active-card{
  border-color:var(--orange);
  box-shadow:var(--shadow-lift);
}
.ex-card.done{border-color:transparent;background:var(--green-lo);box-shadow:none;}
.ex-card.skipped{opacity:.45;}

.ex-top{display:flex;align-items:center;padding:15px 15px;gap:12px;cursor:pointer;}
/* No filled tile. The pastel rounded squares read as stickers, and they fought
   the card material once cards became lit surfaces. The icon now sits directly
   on the card at 40px for row alignment; category stays legible through stroke
   colour alone, which is quieter and themes for free via currentColor. */
.ex-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-icon.gym{color:var(--accent-text);}
.ex-icon.physio{color:var(--green);}
.ex-icon.cardio{color:var(--amber);}

.ex-info{flex:1;min-width:0;}
.ex-name{font-size:14px;font-weight:600;letter-spacing:-0.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ex-card.done .ex-name{color:var(--dim);}
.ex-meta{font-size:11px;color:var(--dim);margin-top:3px;}

.ex-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.watch-chip{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:500;color:var(--mid);text-decoration:none;white-space:nowrap;}
.ex-chev{color:var(--b2);font-size:16px;transition:transform .2s;}
.ex-chev.open{transform:rotate(180deg);}

/* ── SETS BODY ── */
.sets-body{display:none;border-top:1px solid var(--b1);}
.sets-body.open{display:block;}

.cue-box{margin:12px 14px 10px;padding:10px 13px;border-left:2px solid var(--orange);background:var(--orange-lo);border-radius:0 6px 6px 0;font-size:12px;color:var(--orange-mid);line-height:1.6;}

.action-row{display:flex;gap:8px;padding:0 14px 10px;}
.skip-btn{background:transparent;border:1px solid var(--b2);border-radius:6px;padding:6px 12px;font-size:11px;font-weight:500;color:var(--dim);cursor:pointer;font-family:var(--font-body);letter-spacing:0.3px;}
.skip-btn:active{border-color:var(--mid);color:var(--lt);}

/* ── SET ROWS ── */
.sets-wrap{padding:0 var(--sp-4) var(--sp-1);}
.set-hdr{display:grid;grid-template-columns:32px 1fr 16px 1fr 44px 32px;gap:6px;padding:0 2px 6px;font-size:10px;font-weight:var(--fw-cap);letter-spacing:.4px;color:var(--dim);text-transform:uppercase;text-align:center;}
.unit-chip{background:transparent;border:1px solid var(--b1);border-radius:6px;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--dim);padding:2px 5px;cursor:default;text-transform:uppercase;}
.unit-chip.tappable{cursor:pointer;border-color:var(--orange);color:var(--orange);}
.unit-chip.tappable:active{background:var(--orange-lo);}

.set-row{
  display:grid;grid-template-columns:32px 1fr 16px 1fr 44px 32px;
  gap:6px;align-items:center;min-height:54px;
  background:var(--s2);border-radius:var(--r-md);padding:0 10px;
  margin-bottom:7px;border:1px solid transparent;transition:all .2s;
}
.set-row.done{background:var(--green-lo);}
.set-row.needs-input{border-color:var(--amber);}

.sn{font-size:12px;font-weight:600;color:var(--dim);text-align:center;}
.set-row.done .sn{color:var(--green);}

.si{width:100%;background:transparent;border:none;outline:none;font-family:var(--font-body);font-size:20px;font-weight:700;color:var(--white);text-align:center;-webkit-appearance:none;}
.si::placeholder{color:var(--b2);font-size:14px;font-weight:400;}
.set-row.done .si{color:var(--mid);}
.sx{font-size:12px;color:var(--dim);text-align:center;}

.sdone{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--b2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim);transition:all .15s;flex-shrink:0;margin:0 auto;}
.sdone.done{background:var(--green);border-color:var(--green);color:#fff;}
.sdone.locked{opacity:.3;cursor:not-allowed;}

/* Cardio */
.cardio-row{display:flex;align-items:center;justify-content:space-between;min-height:54px;background:var(--s2);border-radius:8px;padding:0 14px;margin-bottom:6px;border:1px solid transparent;cursor:pointer;transition:all .2s;}
.cardio-row.done{background:var(--green-lo);border-color:var(--green);}
.cardio-dur{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
.cardio-row.done .cardio-dur{color:var(--green);}
.cardio-chk{width:36px;height:36px;border-radius:6px;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim);transition:all .2s;}
.cardio-row.done .cardio-chk{background:var(--green);border-color:var(--green);color:var(--s1);}

/* Secondary destructive action, so it stays quiet at --dim and only turns
   --red on press. Full row height for a comfortable touch target without
   widening the column and squeezing the inputs. */
.sdel{width:32px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;padding:0;cursor:pointer;color:var(--dim);opacity:.7;transition:color .15s,opacity .15s;}
.sdel:active{color:var(--red);opacity:1;}
/* Neutral, not green, on completed rows: a success-coloured trash reads as
   the wrong affordance, and --mid clears contrast on the green wash. */
.set-row.done .sdel{color:var(--mid);opacity:.6;}
/* Rest day: shown INSIDE the hero where the progress bar would be, so the
   day is one element rather than a hero plus a notice bar. Hero tokens
   only, per the hero scope rules. */
/* Intensity tag. Was baked into the label as "Back & Biceps · Heavy", which
   in the display face wrapped and orphaned "· HEAVY" onto its own line.
   As a separate baseline-aligned chip it cannot break the title, and it
   reads as metadata rather than part of the name. */
/* One "add" idiom. These were dashed outlines, which read as a drop zone or
   an unfinished placeholder rather than a deliberate action, and all three
   shouted in uppercase letterspacing. Solid hairline, sentence case. */
.add-set-btn:active,.add-food-btn:active,.custom-trigger:active{background:var(--s2);border-color:var(--b2);color:var(--white);}

/* Escape hatch for a session the app cannot see: work logged under a previous
   program's exercise ids, or a session done away from the phone. Quiet on
   purpose, it must never compete with Start Workout. */
/* Mark complete reuses .btn-start verbatim and sits above the session notes,
   not under the session bar, where it competed with Start Workout. */
.markdone-bar{margin-top:var(--sp-4);}
/* Custom exercises could only be removed via the swap sheet, which needs you to
   add something first. This is the direct route. */
.ex-del{background:transparent;border:none;padding:4px;margin-right:2px;color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;border-radius:var(--r-sm);}
.ex-del:active{color:var(--red);background:var(--s2);}
.sess-undo{margin-left:10px;background:transparent;border:none;font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--hero-fg-faint);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}

/* The deficit score folds intake, resting and active into one number, which
   is right for SCORING but hides which lever is moving. This shows the
   working: the three daily averages that produce it, and the result against
   what the phase needs. Active is visible again without being scored twice. */
.comp-inputs{display:flex;flex-wrap:wrap;gap:4px var(--sp-3);padding:8px 0 4px;font-size:11px;color:var(--dim);line-height:1.6;}
.comp-inputs b{font-weight:600;color:var(--lt);font-variant-numeric:tabular-nums;}
.comp-inputs-out{flex:1 1 100%;color:var(--mid);}
.comp-inputs-out b{color:var(--accent-text);}

/* PR row: tapping the body still jumps to the exercise, the trash removes a
   bad entry. Quiet at --dim so it never competes with the record itself. */
.pr-head{display:flex;align-items:flex-start;gap:var(--sp-2);}
.pr-open{flex:1;cursor:pointer;min-width:0;}
.pr-del{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;padding:0;cursor:pointer;color:var(--dim);opacity:.7;transition:color .15s,opacity .15s;}
.pr-del:active{color:var(--red);opacity:1;}

/* ── MACRO GRID ─────────────────────────────────────────────────────────────
   Was six identical bordered --s2 tiles in a 3x2 grid, which is the "six
   little boxes" dashboard pattern and, worse, discarded the fact that four of
   the six have a target or a limit. Borderless now: the label is a quiet
   caption, the number is the only heavy element, and a 2px track shows
   progress where progress means something. Lives inside .nut-hero, so
   --hero-* tokens only. */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4) var(--sp-3);margin-top:var(--sp-4);}
.macro-k{font-size:11px;color:var(--hero-fg-faint);margin-bottom:3px;}
.macro-v{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--hero-fg);
  font-variant-numeric:tabular-nums;line-height:1.1;}
/* Unit/target rides small and muted so the digit stays the thing you read. */
.macro-v i{font-family:var(--font-body);font-style:normal;font-size:11px;font-weight:500;color:var(--hero-fg-faint);}
.macro-tr{height:2px;border-radius:var(--r-pill);background:var(--hero-line);margin-top:7px;overflow:hidden;}
.macro-tr span{display:block;height:100%;border-radius:var(--r-pill);transition:width .3s ease;}

/* ── DATA LIST ──────────────────────────────────────────────────────────────
   Same principle as the rest-day hero: stop stacking boxes and let type carry
   the hierarchy. This replaced a nested --s2 card sitting inside another card,
   with a shouty uppercase caption and a 1px rule under every row. Box-in-box is
   the clearest generic-dashboard tell in the app, and the rules made five rows
   read as a table rather than a ranking. Now: no container, a sentence-case
   caption, a quiet ordinal, and the number as the only heavy element. */
.lift-board{margin-bottom:var(--sp-4);}
.lift-cap{font-size:var(--fs-cap);font-weight:var(--fw-cap);color:var(--mid);margin-bottom:var(--sp-2);}
.lift-row{display:flex;align-items:baseline;gap:var(--sp-3);padding:9px 0;}
/* Hairline between rows only, never around them, and never on the last row. */
.lift-row+.lift-row{border-top:1px solid var(--b1);}
.lift-rank{width:14px;flex-shrink:0;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
.lift-name{flex:1;font-size:13px;color:var(--lt);}
.lift-val{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--white);
  font-variant-numeric:tabular-nums;letter-spacing:.3px;}
/* Unit rides small and muted so the digits stay the thing you read. */
.lift-unit{font-family:var(--font-body);font-size:11px;font-weight:500;color:var(--dim);margin-left:2px;}
.hero-tag{display:inline-block;vertical-align:middle;margin-left:12px;transform:translateY(-0.32em);font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--hero-accent);border:1px solid var(--hero-line);border-radius:var(--r-pill);padding:4px 10px;white-space:nowrap;}
.hero-next{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--hero-line);}
.hero-next-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--hero-fg-faint);}
.hero-next-day{font-family:var(--font-display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--hero-accent);}
.hero-next-ex{font-size:13px;color:var(--hero-fg-dim);flex:1 1 100%;}
.add-set-btn{width:100%;border:1px solid var(--b1);border-radius:var(--r-md);padding:11px;font-size:12px;font-weight:500;color:var(--dim);background:transparent;cursor:pointer;font-family:var(--font-body);margin-top:2px;margin-bottom:10px;transition:all .15s;}
.add-set-btn:active{border-color:var(--orange);color:var(--orange);}

/* ── CUSTOM EX ── */
.custom-wrap{margin:0 var(--sp-4) var(--sp-3);}
.custom-trigger{width:100%;padding:12px;border:1px solid var(--b1);border-radius:var(--r-md);background:transparent;cursor:pointer;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:1px;color:var(--dim);text-transform:uppercase;transition:all .15s;}
.custom-trigger:active{border-color:var(--orange);color:var(--orange);}

.custom-form{display:none;background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:14px;margin-top:8px;}
.custom-form.open{display:block;}
.cf-label{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;display:block;margin-bottom:5px;}
.search-wrap{position:relative;margin-bottom:12px;}
.cf-inp{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:11px 13px;font-family:var(--font-body);font-size:14px;color:var(--white);outline:none;-webkit-appearance:none;}
.cf-inp:focus{border-color:var(--orange);}
.cf-inp::placeholder{color:var(--dim);}
.search-dd{position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--s2);border:1px solid var(--orange);border-top:none;border-radius:0 0 10px 10px;max-height:340px;overflow-y:auto;display:none;box-shadow:var(--shadow-lift);}
.search-dd.show{display:block;}
.dd-item{padding:13px 14px;font-size:14px;font-weight:500;cursor:pointer;border-bottom:1px solid var(--b1);transition:background .1s;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.dd-item:last-child{border:none;}
.dd-item:active{background:var(--s3);}
.dd-item-left{flex:1;}
.dd-name{font-size:14px;font-weight:500;}
.dd-cat{font-size:11px;color:var(--dim);margin-top:3px;}
.dd-warn{font-size:11px;color:var(--amber);margin-top:3px;font-weight:600;}
.dd-alt-btn{background:transparent;border:1px solid var(--amber);color:var(--amber);}
.dd-add-btn{background:var(--accent);border:none;border-radius:6px;padding:6px 12px;font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--accent-ink);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.num-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.cf-num{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:11px;font-family:var(--font-body);font-size:18px;font-weight:700;color:var(--white);outline:none;text-align:center;-webkit-appearance:none;}
.cf-num:focus{border-color:var(--orange);}
.cf-num::placeholder{color:var(--dim);font-size:13px;font-weight:400;}
.cf-add{width:100%;padding:13px;background:var(--accent-grad);border:none;border-radius:8px;font-family:var(--font-body);font-size:14px;font-weight:700;letter-spacing:1px;color:var(--accent-ink);cursor:pointer;text-transform:uppercase;}
.cf-add:active{opacity:.85;}

/* ── REST DAY ── */
.rest-screen{padding:48px 18px 20px;text-align:center;}
.rest-emoji{font-size:48px;margin-bottom:14px;}
.rest-ttl{font-family:var(--font-display);font-size:38px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--orange);margin-bottom:8px;}
.rest-body{font-size:14px;color:var(--mid);line-height:1.7;margin-bottom:22px;}
.rest-card{background:var(--s1);border:1px solid var(--b1);border-left:2px solid var(--green);border-radius:0 10px 10px 0;padding:14px 16px;text-align:left;}
.rest-card-title{font-size:13px;font-weight:600;color:var(--green);margin-bottom:5px;}
.rest-card-body{font-size:12px;color:var(--mid);line-height:1.6;}

/* ── AI ── */
.ai-wrap{padding:var(--sp-4);}
.ai-pg-title{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.ai-pg-title span{color:var(--orange);}
.ai-pg-sub{font-size:12px;color:var(--dim);margin-bottom:18px;}
.ai-card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:16px;margin-bottom:12px;}
.ai-card-title{font-size:15px;font-weight:700;letter-spacing:-0.2px;margin-bottom:4px;}
.ai-card-sub{font-size:12px;color:var(--mid);margin-bottom:12px;line-height:1.5;}
.ai-inp{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:12px 13px;font-family:var(--font-body);font-size:13px;color:var(--white);outline:none;margin-bottom:10px;-webkit-appearance:none;}
.ai-inp:focus{border-color:var(--orange);}
.ai-inp::placeholder{color:var(--dim);}
.ai-btn{width:100%;padding:13px;background:var(--accent-grad);border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent-ink);cursor:pointer;text-transform:uppercase;margin-bottom:10px;}
.ai-btn:active{opacity:.85;}
.ai-out{background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:12px 13px;font-size:12px;color:var(--mid);line-height:1.7;white-space:pre-wrap;display:none;}
.ai-out.show{display:block;color:var(--lt);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.ai-sm{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:10px;font-family:var(--font-body);font-size:17px;font-weight:700;color:var(--white);outline:none;text-align:center;-webkit-appearance:none;}
.ai-sm:focus{border-color:var(--orange);}
.ai-sm::placeholder{color:var(--dim);font-size:12px;font-weight:400;}
.ai-lbl{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;display:block;margin-bottom:5px;}

/* ── SETTINGS ── */
.st-wrap{padding:var(--sp-4);}
.st-pg-title{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.st-pg-title span{color:var(--orange);}
.st-pg-sub{font-size:12px;color:var(--dim);margin-bottom:18px;}
.st-sec{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;margin:16px 0 8px;}
/* Sits INSIDE an accordion, which is already the container, so a border and
   fill here made it box-in-box (three levels with the outer group). Unboxed:
   the accent stripe alone marks it, spacing does the separating. */
.export-card{background:transparent;border:none;border-left:2px solid var(--accent-text);border-radius:0;padding:2px 0 2px var(--sp-4);margin-bottom:var(--sp-5);}
.wdef-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--b1);}
.wdef-row:last-of-type{border-bottom:none;}
.wdef-day{font-size:13px;font-weight:600;color:var(--lt);}
.export-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.export-sub{font-size:12px;color:var(--mid);margin-bottom:12px;line-height:1.5;}
.btn-row{display:flex;gap:8px;margin-bottom:10px;}
.btn-o{flex:1;padding:12px;background:var(--accent-grad);border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:0.5px;color:var(--accent-ink);cursor:pointer;}
.btn-g{flex:1;padding:12px;background:transparent;border:1px solid var(--b2);border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:0.5px;color:var(--mid);cursor:pointer;}
.export-area{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:12px;font-size:11px;color:var(--dim);font-family:monospace;min-height:160px;outline:none;resize:none;}
.rule-item{background:var(--s1);border:1px solid var(--b1);border-left:3px solid var(--red);border-radius:var(--r-md);padding:11px 13px;margin-bottom:7px;}
.rule-ttl{font-size:13px;font-weight:600;margin-bottom:3px;}
.rule-desc{font-size:12px;color:var(--mid);line-height:1.5;}
.st-group{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;}
.st-row{display:flex;align-items:center;padding:14px;gap:12px;border-bottom:1px solid var(--b1);cursor:pointer;}
.st-row:last-child{border:none;}
/* Holds a 18px SVG, not a 16px emoji glyph. Inherits --mid so the 13 rows
   read as one quiet system instead of 13 competing colours. */
.st-icon{width:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--mid);}
.st-info{flex:1;}
.st-ttl{font-size:14px;font-weight:600;}
.st-sub{font-size:12px;color:var(--mid);margin-top:2px;}

/* ── BOTTOM NAV ── */
.bot-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:var(--s0);border-top:1px solid var(--b1);display:flex;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;gap:4px;cursor:pointer;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:0.3px;transition:color .15s;position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.nav-item.active{color:var(--white);}
.nav-item.active::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;background:var(--accent-text);}
.nav-icon{height:22px;display:flex;align-items:center;}
.nav-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-icon .icon-fill{display:none;stroke:none;}
.nav-item.active .nav-icon .icon-line{display:none;}
.nav-item.active .nav-icon .icon-fill{display:block;fill:currentColor;}

/* ── TOAST ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--s1);border:1.5px solid var(--orange);border-radius:8px;color:var(--white);font-weight:600;font-size:13px;letter-spacing:0.2px;padding:10px 20px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.toast-big{font-size:15px;padding:14px 24px;border-radius:12px;top:24px;white-space:normal;text-align:center;max-width:280px;}
.toast.toast-big.show{animation:toastPop .4s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) scale(.7);}to{opacity:1;transform:translateX(-50%) scale(1);}}

/* ── SUMMARY ── */
.summary{display:none;position:fixed;inset:0;background:var(--black);z-index:400;align-items:center;justify-content:center;padding:24px;}
.summary.show{display:flex;}
.sum-inner{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;}
.sum-icon{font-size:56px;margin-bottom:14px;}
.sum-title{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--orange);margin-bottom:6px;text-align:center;}
.sum-sub{font-size:14px;color:var(--mid);text-align:center;margin-bottom:28px;line-height:1.6;}
.sum-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:28px;}
.sum-stat{background:var(--s1);border:1px solid var(--b1);border-top:2px solid var(--orange);border-radius:12px;padding:20px 16px;text-align:center;}
.sum-val{font-family:var(--font-display);font-size:38px;font-weight:700;color:var(--orange);letter-spacing:.5px;font-variant-numeric:tabular-nums;}
.sum-lbl{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;margin-top:4px;}
.sum-close{width:100%;padding:18px;background:var(--accent-grad);border:none;border-radius:12px;font-family:var(--font-body);font-size:15px;font-weight:700;letter-spacing:1.5px;color:var(--accent-ink);cursor:pointer;text-transform:uppercase;}

/* ── SPINNER ── */
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--b2);border-top-color:var(--orange);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ── DEMO PLAYER ── */
.demo-wrap{margin:var(--sp-3) var(--sp-4) 0;border-radius:var(--r-md);overflow:hidden;background:#fff;}
.demo-wrap video,.demo-wrap img{display:block;width:100%;max-height:230px;object-fit:contain;}
.demo-flip{position:relative;}
.demo-flip img{width:100%;display:block;}
.demo-flip img:last-child{position:absolute;inset:0;opacity:0;animation:demoflip 1.6s steps(1) infinite;}
@keyframes demoflip{0%{opacity:0}50%{opacity:1}100%{opacity:0}}

/* ── REST TIMER (background-safe) ── */
.rest-timer-overlay{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;background:var(--s1);border:1px solid var(--orange);border-radius:16px;padding:14px 24px;min-width:180px;text-align:center;box-shadow:var(--shadow-lift);}
.rest-timer-overlay.show{display:block;}
.rest-timer-num{font-family:var(--font-display);font-size:56px;font-weight:700;color:var(--orange);letter-spacing:.5px;line-height:1;font-variant-numeric:tabular-nums;}
.rest-timer-lbl{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;margin-top:2px;}
.rest-timer-skip{margin-top:10px;background:transparent;border:1px solid var(--b2);border-radius:8px;padding:7px 16px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;}

/* ── NUTRITION ── */
.nut-wrap{padding:14px 18px 20px;}.nut-date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}.nut-date-nav button{background:transparent;border:1px solid var(--b2);border-radius:6px;color:var(--mid);font-family:var(--font-body);font-size:18px;width:36px;height:36px;cursor:pointer;}.nut-date-lbl{font-size:13px;font-weight:600;color:var(--lt);}.nut-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);}.nut-card-title{font-size:var(--fs-cap);font-weight:var(--fw-cap);color:var(--mid);margin-bottom:10px;}.burn-row{display:flex;gap:8px;}.burn-col{flex:1;text-align:center;}.burn-val{font-size:20px;font-weight:700;color:var(--white);letter-spacing:-0.5px;}.burn-val.tappable{cursor:pointer;border-bottom:1px solid var(--b2);}.burn-lbl{font-size:10px;color:var(--dim);margin-top:2px;}.target-display{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}.target-num{font-size:28px;font-weight:700;letter-spacing:-0.5px;}.target-pill-g{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;}.tpill-green{background:var(--green-lo);color:var(--green);}.tpill-amber{background:var(--amber-lo);color:var(--amber);}.tpill-red{background:var(--red-lo);color:var(--red);}.prog-bar-wrap{height:8px;background:var(--b1);border-radius:var(--r-pill);overflow:visible;margin-bottom:8px;position:relative;}.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-text),var(--hero-accent));border-radius:var(--r-pill);transition:width .4s ease;position:relative;}.prog-thumb{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:var(--hero-accent);box-shadow:0 0 8px var(--accent);}.macro-row{display:flex;gap:6px;margin-top:6px;}.macro-chip{flex:1;background:var(--s2);border-radius:8px;padding:8px 6px;text-align:center;}.macro-val{font-size:16px;font-weight:700;color:var(--white);}.macro-lbl{font-size:10px;font-weight:var(--fw-cap);color:var(--dim);margin-top:2px;}.net-line{font-size:12px;margin-top:8px;text-align:center;font-weight:600;}.net-green{color:var(--green);}.net-red{color:var(--red);}/* Shock day is an exception you reach for occasionally, not the primary
   action on the screen. It was a full-width uppercase letterspaced amber
   outline, which read louder than "Log a meal". Sentence case, hairline
   border, amber reserved for the ACTIVE state where it means something. */
.shock-btn{width:100%;margin-top:var(--sp-4);padding:11px;background:transparent;border:1px solid var(--b1);border-radius:var(--r-md);font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--hero-fg-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}.shock-btn.active{border-color:var(--amber);color:var(--amber);}.food-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b1);}.food-item:last-child{border:none;}.food-name{font-size:13px;font-weight:600;color:var(--white);}.food-macros{font-size:11px;color:var(--dim);margin-top:2px;}.food-kcal{font-size:15px;font-weight:700;color:var(--orange);margin-right:10px;white-space:nowrap;}.food-del{background:transparent;border:1px solid var(--b2);border-radius:6px;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;padding:5px 10px;}.add-food-btn{width:100%;padding:12px;background:transparent;border:1px solid var(--b1);border-radius:var(--r-md);font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--lt);cursor:pointer;}.food-ta{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:11px 13px;font-family:var(--font-body);font-size:13px;color:var(--white);outline:none;resize:none;min-height:70px;-webkit-appearance:none;}.food-ta:focus{border-color:var(--orange);}.food-ta::placeholder{color:var(--dim);}.food-chat-btns{display:flex;gap:8px;margin-top:8px;}.food-submit{flex:1;padding:12px;background:var(--accent-grad);border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--accent-ink);cursor:pointer;}.food-cancel{padding:12px 16px;background:transparent;border:1px solid var(--b2);border-radius:8px;font-family:var(--font-body);font-size:13px;color:var(--dim);cursor:pointer;}.pending-food{background:var(--s2);border:1px solid var(--orange);border-radius:10px;padding:13px;margin-top:10px;}.pending-name{font-size:15px;font-weight:700;margin-bottom:4px;}.pending-macros{font-size:12px;color:var(--mid);margin-bottom:10px;}.pending-btns{display:flex;gap:8px;}.pf-add{flex:1;padding:11px;background:var(--green);border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--s1);cursor:pointer;}.pf-redo{padding:11px 14px;background:transparent;border:1px solid var(--b2);border-radius:8px;font-family:var(--font-body);font-size:13px;color:var(--dim);cursor:pointer;}.wt-inp{width:100px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:10px;font-family:var(--font-body);font-size:17px;font-weight:700;color:var(--white);outline:none;text-align:center;-webkit-appearance:none;}.wt-inp:focus{border-color:var(--orange);}.wt-save{padding:10px 18px;background:var(--accent-grad);border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--accent-ink);cursor:pointer;}.sparkline-wrap{margin:10px 0;overflow:hidden;border-radius:6px;}.wt-recent{font-size:11px;color:var(--dim);line-height:1.9;}.wt-recent span{color:var(--lt);}.wt-arrival{font-size:13px;color:var(--mid);margin-top:8px;}.wt-arrival b{color:var(--white);}.wt-bmr{font-size:12px;color:var(--dim);margin-top:4px;}.hk-btn{width:100%;padding:11px;background:transparent;border:1px solid var(--blue);border-radius:8px;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:1px;color:var(--blue);cursor:pointer;text-transform:uppercase;}/* ── AI CHAT PANEL ── */
.forge-chat-overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:var(--scrim-blur);-webkit-backdrop-filter:var(--scrim-blur);z-index:250;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.forge-chat-overlay.open{opacity:1;pointer-events:auto;}
.forge-chat-modal{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:var(--black);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:251;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;height:72vh;height:72dvh;max-height:640px;box-shadow:var(--shadow-lift);}
.forge-chat-modal.open{transform:translateY(0);}
.forge-chat-drag{width:40px;height:4px;background:var(--b2);border-radius:var(--r-pill);margin:12px auto 0;}
.ai-chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--b1);}
.ai-chat-title-wrap{display:flex;align-items:center;gap:8px;}
.ai-chat-title-icon{display:flex;align-items:center;justify-content:center;color:var(--accent-text);}
.ai-chat-title{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--white);letter-spacing:.3px;text-transform:uppercase;}
.ai-chat-clear{background:var(--s2);border:1px solid var(--b2);border-radius:8px;font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--dim);cursor:pointer;padding:6px 10px;}
.ai-chat-messages{padding:14px;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;flex:1;}
.ai-chat-empty{margin:auto 0;text-align:center;padding:20px 16px;color:var(--dim);}
.ai-chat-empty-icon{display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--accent-text);opacity:.85;}
.ai-chat-empty-ttl{font-size:14px;font-weight:700;color:var(--lt);margin-bottom:4px;}
.ai-chat-empty-sub{font-size:12px;line-height:1.5;max-width:260px;margin:0 auto;}
.ai-chat-empty{font-size:12px;color:var(--dim);text-align:center;padding:20px 0;}
.chat-bubble{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;}
.chat-user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:14px 14px 3px 14px;}
.chat-ai-row{display:flex;align-items:flex-end;gap:6px;align-self:flex-start;max-width:90%;}
.chat-ai-avatar{width:22px;height:22px;border-radius:50%;background:var(--accent-lo);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-bottom:1px;}
.chat-ai{background:var(--s2);color:var(--lt);border:1px solid var(--b1);border-radius:3px 14px 14px 14px;}
.chat-thinking{align-self:flex-start;background:var(--s2);color:var(--dim);border:1px solid var(--b1);border-radius:12px 12px 12px 2px;padding:9px 12px;font-size:12px;font-style:italic;}
.ai-chat-bar{display:flex;gap:8px;padding:12px 16px calc(34px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--b1);align-items:flex-end;box-sizing:border-box;}
.ai-chat-inp{flex:1;min-width:0;background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:10px 12px;font-family:var(--font-body);font-size:13px;color:var(--white);outline:none;resize:none;-webkit-appearance:none;box-sizing:border-box;}
.ai-chat-inp:focus{border-color:var(--orange);}
.ai-chat-inp::placeholder{color:var(--dim);}
.ai-chat-send{flex-shrink:0;padding:10px 16px;background:var(--white);border:none;border-radius:10px;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--black);cursor:pointer;white-space:nowrap;}
.ai-chat-send:disabled{opacity:.45;cursor:default;}
.ai-accordion{margin-top:10px;border:1px solid var(--b1);border-radius:12px;overflow:hidden;}.ai-accordion summary{padding:14px;font-size:13px;font-weight:700;color:var(--mid);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;}.ai-accordion summary::-webkit-details-marker{display:none;}.ai-accordion[open] summary{border-bottom:1px solid var(--b1);}.ai-acc-inner{padding:12px;}.weekly-note{background:var(--s2);border-left:3px solid var(--orange);border-radius:var(--r-md);padding:11px 13px;margin-bottom:10px;font-size:12px;color:var(--lt);line-height:1.7;}.weekly-note-title{font-size:var(--fs-cap);font-weight:600;color:var(--accent-text);margin-bottom:5px;}.modal-overlay{display:none;position:fixed;inset:0;background:var(--scrim);backdrop-filter:var(--scrim-blur);-webkit-backdrop-filter:var(--scrim-blur);z-index:300;align-items:flex-end;justify-content:center;}.modal-overlay.show{display:flex;}.modal-box{background:var(--s1);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 18px 40px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;}.modal-title{font-size:17px;font-weight:700;}.modal-sub{font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.6;}.modal-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}.modal-step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}.modal-step-text{font-size:13px;color:var(--lt);line-height:1.65;}.modal-url{background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:10px 12px;font-family:monospace;font-size:11px;color:var(--mid);word-break:break-all;margin-bottom:14px;}.modal-btns{display:flex;gap:8px;margin-top:16px;}.modal-copy{flex:1;padding:13px;background:var(--accent-grad);border:none;border-radius:8px;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--accent-ink);cursor:pointer;}.modal-close-btn{padding:13px 18px;background:transparent;border:1px solid var(--b2);border-radius:8px;font-family:var(--font-body);font-size:13px;color:var(--dim);cursor:pointer;}

/* ── NUTRITION v2 ── */
.nut-wrap{padding:var(--sp-4) var(--sp-4) var(--sp-5);}
.nut-head{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 4px 18px;}
.nut-kicker{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;margin-bottom:3px;}
.nut-title{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--white);line-height:1.02;}
.nut-nav-btns{display:flex;gap:8px;}
.nut-nav-btns button{width:38px;height:38px;border-radius:50%;background:var(--s1);border:1px solid var(--b1);color:var(--mid);font-family:var(--font-body);font-size:18px;cursor:pointer;}

.burn-val{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--white);}
.nut-hero{background:var(--grad-nut);border:none;border-top:1px solid rgba(200,241,53,.28);color:var(--hero-fg);box-shadow:var(--shadow-lift);position:relative;overflow:hidden;}
.nut-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% -10%,rgba(200,241,53,.14),transparent 55%),radial-gradient(100% 70% at 15% 110%,rgba(255,255,255,.06),transparent 60%);pointer-events:none;}
.nut-hero>*{position:relative;z-index:1;}
.nut-hero .nut-card-title{color:var(--hero-fg-dim);}
.nut-hero .target-num{color:var(--hero-fg);font-family:var(--font-display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;}
.nut-hero .target-num span{color:var(--hero-fg-dim)!important;}
.nut-hero .target-pill-g{background:var(--hero-chip)!important;color:var(--hero-fg)!important;}
.nut-hero .prog-bar-wrap{background:var(--hero-line);}
.nut-hero .prog-bar-fill{background:var(--hero-accent);}
.nut-hero .consumed-line{color:var(--hero-fg-dim)!important;}
.nut-hero .macro-chip{background:var(--hero-chip);}
.nut-hero .macro-val{color:var(--hero-fg);}
.nut-hero .macro-val span{color:var(--hero-fg-dim)!important;}
.nut-hero .macro-lbl{color:var(--hero-fg-dim);}
.nut-hero .net-line.net-green{color:var(--hero-pos);}
.nut-hero .net-line.net-red{color:var(--hero-neg);}
.nut-hero .shock-btn{border-color:var(--hero-fg-dim);color:var(--hero-fg);}
.nut-hero .shock-btn.active{background:var(--hero-chip);}
.nut-ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:128px;height:128px;margin:2px auto 8px;}
.nut-ring-text{position:absolute;text-align:center;}
.nut-ring-big{font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--hero-fg);line-height:1;font-variant-numeric:tabular-nums;}
.nut-ring-small{font-size:11px;color:var(--hero-fg-dim);margin-top:3px;}
.nut-ring-fill{transition:stroke-dashoffset .6s ease;}
.nut-hero .food-item{border-color:var(--hero-line);}
.nut-hero .food-name{color:var(--hero-fg);}
.nut-hero .food-name span{color:var(--hero-fg-faint)!important;}
.nut-hero .food-macros{color:var(--hero-fg-dim);}
.nut-hero .food-kcal{color:var(--hero-fg);}
.nut-hero .food-del{color:var(--hero-neg);border-color:var(--hero-fg-faint);}
.nut-hero .add-food-btn{border-color:var(--hero-fg-faint);color:var(--hero-fg);}
.nut-hero .food-ta{background:var(--hero-chip);border-color:var(--hero-fg-faint);color:var(--hero-fg);}
.nut-hero .food-ta::placeholder{color:var(--hero-fg-dim);}
.nut-hero .food-cancel{color:var(--hero-fg);border-color:var(--hero-fg-faint);}
.nut-hero .food-submit{background:var(--accent-grad);color:var(--accent-ink);}
.nut-hero .pending-food{background:rgba(0,0,0,.2);border-color:var(--hero-fg-faint);}
.nut-hero .pending-macros{color:var(--hero-fg-dim);}
.nut-hero .pf-redo{color:var(--hero-fg);border-color:var(--hero-fg-faint);}
.nut-hero .ai-out{background:rgba(0,0,0,.2);border-color:var(--hero-line);color:var(--hero-fg);}

/* ── MACRO PIE ── */
.mpie-wrap{display:flex;align-items:center;gap:16px;margin:12px 0 10px;}
.mpie-donut{width:72px;height:72px;border-radius:50%;flex-shrink:0;position:relative;}
.mpie-hole{position:absolute;inset:16px;border-radius:50%;background:var(--s1);}
.nut-hero .mpie-hole{background:rgba(14,16,10,.85);}
.mpie-legend{flex:1;display:flex;flex-direction:column;gap:7px;}
.mpie-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mid);}
.mpie-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.mpie-val{margin-left:auto;font-size:11px;font-weight:600;color:var(--dim);}
.nut-hero .mpie-row{color:var(--hero-fg-dim);}
.nut-hero .mpie-val{color:var(--hero-fg-faint);}

/* ── SETTINGS v3 — accordion groups ── */
.st-acc{border-radius:var(--r-lg);background:var(--s1);border:1px solid var(--b1);margin-bottom:12px;overflow:hidden;}
.st-acc>summary{padding:16px;font-size:14px;font-weight:700;color:var(--white);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;user-select:none;}
.st-acc>summary::-webkit-details-marker{display:none;}
.st-acc>summary::after{content:"›";font-size:20px;color:var(--dim);transition:transform .2s;line-height:1;}
.st-acc[open]>summary::after{transform:rotate(90deg);}
.st-acc>summary .st-acc-sub{font-size:11px;font-weight:400;color:var(--dim);margin-top:1px;}
.st-acc-inner{padding:0 16px 16px;border-top:1px solid var(--b1);}
/* duplicate .st-sec removed 2026-07 — was silently dropping text-transform:uppercase
   from the rule above and drifting the size/weight/color out of sync (see canonical
   definition above). All shared properties now live in the one rule above; this
   selector previously existed only to declare margin, which is unified there now. */
.st-sec:first-child{margin-top:14px;}
.st-subacc{border-radius:var(--r-md);background:var(--s2);border:1px solid var(--b1);margin:0 0 14px;overflow:hidden;}
.st-subacc>summary{padding:13px 14px;font-size:13px;font-weight:700;color:var(--white);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;user-select:none;}
.st-subacc>summary::-webkit-details-marker{display:none;}
.st-subacc>summary::after{content:"›";font-size:17px;color:var(--dim);transition:transform .2s;line-height:1;}
.st-subacc[open]>summary::after{transform:rotate(90deg);}
.st-subacc>summary .st-subacc-note{font-size:11px;font-weight:400;color:var(--dim);margin-top:1px;}
.st-subacc-inner{padding:0 0 12px;border-top:1px solid var(--b1);}
.st-subacc .st-group{margin:12px 12px 0;}
/* Inside an accordion .st-sec is a caption, not a landmark: the accordion
   title above it is already the landmark. Keeps the uppercase treatment
   only where it heads a page-level section. */
.st-acc-inner .st-sec{font-size:var(--fs-cap);font-weight:var(--fw-cap);letter-spacing:0;text-transform:none;color:var(--mid);margin:var(--sp-5) 0 var(--sp-2);}
.st-subacc .st-sec{margin:14px 12px 6px;}
.st-subacc .st-sec:first-of-type{margin-top:14px;}
.danger-zone{margin:16px 12px 0;border-radius:14px;border:1.5px solid var(--red);overflow:hidden;}
.danger-zone .st-sec{margin:0;padding:10px 14px;color:var(--red);border-bottom:1px solid var(--red);background:var(--red-lo);}
.danger-zone .st-group{margin:0;border-radius:0;box-shadow:none;border:none;}

/* Accent buttons: readable text on graphite (light) / off-white (dark) */
.ai-btn,.btn-o,.food-submit,.wt-save,.modal-copy,.cf-add,.sum-close,.lock-btn,.dd-add-btn{color:var(--on-accent);}

/* The Body row had volt-outlined boxes around the two EDITABLE numbers and
   plain type for the two read-only ones, so one row carried two different
   idioms and the boxes read as form fields dropped into a stat strip. All
   four are now the same display-font stat; editability is signalled by a
   dotted underline, the same cue .burn-val.tappable already used, and it
   goes solid volt on focus. */
.burn-inp{width:100%;max-width:96px;background:transparent;border:none;border-bottom:1px solid var(--b2);border-radius:0;padding:2px 0 3px;font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--white);text-align:center;outline:none;font-variant-numeric:tabular-nums;-webkit-appearance:none;}
.burn-inp:focus{border-bottom:1.5px solid var(--accent-text);}
.burn-inp::placeholder{color:var(--dim);}
.burn-inp:disabled{border-bottom-color:transparent;color:var(--lt);}

.plan-nudge{margin:0 16px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.plan-nudge-ttl{font-size:14px;font-weight:700;}
.plan-nudge-sub{font-size:11px;color:var(--dim);margin-top:2px;}

/* ── HAMBURGER DRAWER ── */
.hdr-burger{background:transparent;border:none;color:var(--white);font-size:22px;cursor:pointer;padding:4px 2px 4px 12px;line-height:1;}
.drawer-overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:var(--scrim-blur);-webkit-backdrop-filter:var(--scrim-blur);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:330px;background:var(--black);z-index:201;transform:translateX(102%);transition:transform .28s cubic-bezier(.3,.7,.3,1);overflow-y:auto;padding:18px 16px 40px;box-shadow:var(--shadow-lift);}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.drawer-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;}
.drawer-close{background:var(--s1);border:1px solid var(--b1);border-radius:50%;width:34px;height:34px;color:var(--mid);font-size:16px;cursor:pointer;}
.trend-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-md);padding:13px 14px;margin-bottom:10px;}
.trend-title{font-size:var(--fs-cap);font-weight:var(--fw-cap);color:var(--mid);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.trend-legend{font-size:9px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim);}
.tbars{display:flex;align-items:flex-end;gap:6px;height:64px;}
.tbar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.tbar{width:100%;border-radius:4px 4px 2px 2px;background:var(--b2);min-height:2px;transition:height .3s ease;}
.tbar-lbl{font-size:8px;color:var(--dim);margin-top:4px;letter-spacing:0.5px;}
.tbar-lbl.today{color:var(--orange);font-weight:700;}
.tbar-val{font-size:8px;color:var(--dim);margin-bottom:2px;white-space:nowrap;}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--b2);margin-left:8px;vertical-align:middle;transition:background .3s;}
.sync-dot.on{background:var(--green);}
.sync-dot.off{background:var(--b2);}
.sync-dot.err{background:var(--red);}

/* ── PAST-DAY LOCK ── */
.lock-banner{display:flex;align-items:center;justify-content:center;gap:10px;}
.edit-pill{background:var(--s1);border:1px solid var(--b1);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;box-shadow:var(--shadow);padding:0;}

/* ── LOCK SCREEN ── */
.lock-screen{position:fixed;inset:0;background:var(--black);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;max-width:430px;margin:0 auto;}
.lock-logo{font-size:26px;font-weight:700;letter-spacing:8px;color:var(--orange);text-transform:uppercase;margin-bottom:6px;}
.lock-sub{font-size:12px;color:var(--dim);letter-spacing:0.5px;margin-bottom:44px;text-align:center;line-height:1.6;}
.lock-input{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:15px 16px;font-size:14px;color:var(--white);font-family:inherit;outline:none;margin-bottom:12px;}
.lock-input:focus{border-color:var(--orange);}
.lock-btn{width:100%;background:var(--accent-grad);color:var(--accent-ink);border:none;border-radius:10px;padding:15px;font-size:13px;font-weight:700;font-family:inherit;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:4px;}
.lock-err{font-size:12px;color:var(--red);text-align:center;margin-top:10px;min-height:16px;}

/* ── PLAN MODAL — matches app card theme exactly ── */
.plan-modal{
  display:none;position:fixed;inset:0;z-index:1000;overflow-y:auto;box-sizing:border-box;
  background:var(--black);
  padding:calc(env(safe-area-inset-top,0px) + 76px) 20px 60px;
}
.plan-modal.show{display:block;}
.pm-title{font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--white);margin-bottom:4px;}
.pm-sub{font-size:12px;color:var(--mid);margin-bottom:20px;line-height:1.6;}
.pm-section{font-size:var(--fs-cap);font-weight:600;color:var(--accent-text);margin:18px 0 8px;}
.pm-notes{background:var(--s1);border:1px solid var(--b1);border-left:3px solid var(--accent-text);border-radius:0 8px 8px 0;padding:12px 14px;font-size:13px;color:var(--lt);line-height:1.7;margin-bottom:6px;}
.pm-flag{background:var(--s1);border:1px solid var(--b1);border-left:3px solid var(--accent-text);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;color:var(--mid);line-height:1.5;margin-bottom:6px;}
.pm-change{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.pm-change-reason{font-size:11px;color:var(--dim);margin-top:4px;font-style:italic;}
.pm-change-day{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--accent-text);text-transform:uppercase;margin-bottom:3px;}
.pm-change-ex{font-size:14px;font-weight:700;color:var(--white);}
.pm-change-val{font-size:12px;color:var(--lt);margin-top:3px;font-weight:600;}
.pm-btns{display:flex;gap:10px;margin-top:24px;}
.pm-apply{flex:1;padding:15px;background:var(--accent-grad);border:none;border-radius:10px;font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent-ink);cursor:pointer;text-transform:uppercase;}
.pm-cancel{flex:1;padding:15px;background:transparent;border:1px solid var(--b2);border-radius:10px;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--mid);cursor:pointer;}

/* ── REST TIMER ── */
.rest-timer{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);max-width:300px;width:90%;background:var(--s1);border:2px solid var(--accent-text);border-radius:16px;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px;cursor:pointer;box-shadow:var(--shadow-lift);}
.rt-label{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--orange);text-transform:uppercase;margin-bottom:4px;}
.rt-count{font-family:var(--font-display);font-size:64px;font-weight:700;color:var(--orange);letter-spacing:.5px;line-height:1;font-variant-numeric:tabular-nums;}
.rt-skip{font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:0.5px;}

/* ── OVERLOAD BADGES ── */
.ol-up{display:inline-block;background:var(--green-lo);color:var(--green);border:1px solid var(--green);border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.ol-down{display:inline-block;background:var(--red-lo);color:var(--red);border:1px solid var(--red);border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.ol-eq{display:inline-block;background:var(--s2);color:var(--dim);border:1px solid var(--b2);border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:middle;}

/* ── LAST GHOST ── */
.last-ghost{font-size:10px;color:var(--dim);margin-top:2px;letter-spacing:0.2px;}
.export-sheet{position:fixed;inset:0;background:var(--scrim);backdrop-filter:var(--scrim-blur);-webkit-backdrop-filter:var(--scrim-blur);z-index:9999;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;}
.export-sheet.open{opacity:1;pointer-events:all;}
.export-sheet-inner{background:var(--s1);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:20px 16px 32px;width:100%;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
.export-sheet.open .export-sheet-inner{transform:translateY(0);}
.export-sheet-title{font-size:14px;font-weight:700;color:var(--dim);text-align:center;margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px;}
.export-opt{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:var(--b2);border:none;border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--white);font-size:15px;font-weight:600;cursor:pointer;text-align:left;}
.export-opt-sub{font-size:11px;font-weight:400;color:var(--dim);margin-top:3px;}
.export-cancel{width:100%;background:none;border:none;padding:12px;color:var(--dim);font-size:15px;cursor:pointer;}

/* ── CALF BUTTON ── */
.calf-btn{padding:8px 14px;background:transparent;border:1px solid var(--orange);border-radius:8px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--orange);cursor:pointer;white-space:nowrap;position:relative;transition:all .15s;}
.calf-btn:active{background:var(--orange-lo);}
.calf-btn.calf-warn{border-color:var(--red);color:var(--red);}
.calf-badge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);font-size:9px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;margin-left:5px;vertical-align:middle;}
.calf-btn.calf-warn .calf-badge{background:var(--red);}

/* ── VOLUME BARS ── */
/* Volume list. Was wrapped in a bordered --s2 card INSIDE an accordion that is
   already a container, under a shouty uppercase caption. Unboxed, and the track
   is now visible at 0% so eighteen rows read as progress rather than as a wall
   of identical "0/6" text. Same visual language as .lift-row and the macro
   grid: quiet label, thin track, the number as the only heavy element. */
.vol-list{padding-top:var(--sp-1);}
.vol-bar-wrap{background:var(--b1);border-radius:var(--r-pill);height:3px;flex:1;overflow:hidden;margin:0 var(--sp-3);}
.vol-bar{height:100%;background:var(--accent-text);border-radius:var(--r-pill);transition:width .4s;}
.vol-row{display:flex;align-items:center;padding:8px 0;font-size:13px;color:var(--lt);}
.vol-row+.vol-row{border-top:1px solid var(--b1);}
.vol-muscle{min-width:88px;color:var(--lt);text-transform:capitalize;}
.vol-num{font-variant-numeric:tabular-nums;color:var(--mid);font-size:12px;min-width:34px;text-align:right;}
.vol-count{font-size:11px;color:var(--dim);margin-left:8px;min-width:42px;text-align:right;}

/* ── SESSION NOTES ── */
.notes-area{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:12px 13px;font-family:var(--font-body);font-size:13px;color:var(--lt);outline:none;resize:vertical;min-height:80px;box-sizing:border-box;margin:0 0 12px;}
.notes-area:focus{border-color:var(--orange);}
.notes-area::placeholder{color:var(--dim);}
.notes-wrap{margin:0 var(--sp-4) var(--sp-3);}
.notes-label{font-size:var(--fs-label);font-weight:var(--fw-label);letter-spacing:var(--ls-label);color:var(--dim);text-transform:uppercase;display:block;margin-bottom:6px;}
/* A logged calf twinge makes the note mandatory. Amber is the warning colour
   and is reserved for exactly this kind of needs-input state. */
.notes-req{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:var(--r-pill);background:var(--amber-lo);color:var(--amber);font-size:9px;font-weight:700;letter-spacing:.06em;vertical-align:1px;}
.notes-req.met{background:var(--s2);color:var(--green);}
.notes-area.needed{border-color:var(--amber);}
.notes-area.needed:focus{border-color:var(--amber);}
.notes-hint{display:flex;align-items:flex-start;gap:5px;margin:-6px 0 12px;font-size:var(--fs-cap);font-weight:var(--fw-cap);color:var(--amber);line-height:1.4;}
.notes-hint .icon{flex:0 0 auto;margin-top:1px;}

/* ── PHYSIO REST BANNER ── */
.physio-banner{margin:var(--sp-3) var(--sp-4) var(--sp-1);background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.25);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--green);line-height:1.6;}

/* Phase verdict status dot. Replaces the 🟢🟡🟠🔴 emoji, which were literally
   coloured circles — a CSS dot themes correctly and matches the semantic
   tokens the rest of the app already uses for the same states. */
.band-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;}
.band-green{background:var(--green);}
.band-yellow,.band-orange{background:var(--amber);}
.band-red{background:var(--red);}

/* ── SHARED CARD MATERIAL ────────────────────────────────────────────────────
   One place that turns every flat --s1 rectangle into a lit object: a near-
   invisible vertical gradient plus a brighter top edge, the same light-source
   cue that makes .hero read as physical. Lives at the END of the cascade so it
   beats the earlier per-card `background:var(--s1)` declarations without having
   to edit each one (several are inside minified single-line blocks).

   Deliberately SINGLE-class selectors, which protects COMPOUND modifiers only:
   .ex-card.done is (0,2,0) and still wins its green wash.

   It does NOT protect a second INDEPENDENT class on the same element. That is
   what bit .nut-hero, which rides on <div class="nut-card nut-hero">: it's also
   (0,1,0), so this later rule won on source order and the hero lost both its
   dark --grad-nut background and its volt border-top to --card-edge. Invisible
   in dark mode (--card-grad is dark there) and white-on-white in light. Heroes
   are theme-independent dark surfaces and must never take card material, hence
   the :not(). Adding a card class to a hero element needs an exclusion here.

   Cards on --s2 (.set-row, .st-subacc, .weekly-note, .pending-food) are excluded
   on purpose: they're recessed surfaces, so a lit top edge would fight them. */
.ex-card,.nut-card:not(.nut-hero),.ai-card,.custom-form,.st-group,.st-acc,.trend-card,
.plan-nudge,.rest-card,.export-card,.rule-item,.pm-notes,.pm-flag,.pm-change{
  background:var(--card-grad);
  border-top-color:var(--card-edge);
}
/* .sum-stat gets the material but keeps its 2px volt top border as the
   hierarchy marker, so it must not have border-top-color overwritten. */
.sum-stat{background:var(--card-grad);}

/* Bottom nav joins the same material story: translucent + blurred so content
   dissolves under it while scrolling instead of hitting an opaque slab. */
.bot-nav{
  background:light-dark(rgba(255,255,255,.82),rgba(16,16,20,.8));
  backdrop-filter:var(--scrim-blur);
  -webkit-backdrop-filter:var(--scrim-blur);
}

/* Without backdrop-filter a translucent scrim just looks washed out and the
   text behind it stays readable through the overlay, so raise every blurred
   surface to near-opaque. Safari <9 / Firefox with the pref off land here. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .forge-chat-overlay,.modal-overlay,.drawer-overlay,.export-sheet{
    background:light-dark(rgba(237,236,234,.96),rgba(8,8,10,.96));
  }
  .bot-nav{background:var(--s0);}
}

</style>
</head>
<body>

<div class="lock-screen" id="lockScreen" style="display:none">
  <div class="lock-logo">FORGE</div>
  <div class="lock-sub">Personal fitness. Private by default.<br>Enter your access token to continue.</div>
  <input class="lock-input" id="lockInput" type="password" placeholder="Access token" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitLock()">
  <button class="lock-btn" onclick="submitLock()">Unlock</button>
  <div class="lock-err" id="lockErr"></div>
</div>

<div class="hdr">
  <div class="logo">FORGE<span class="sync-dot" id="syncDot" title="Cloud sync status"></span></div>
